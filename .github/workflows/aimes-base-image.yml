# Builds the AIMES Superset base image from this fork.
#
# The frontend is compiled inside Docker (the `superset-node` stage), so the image never
# depends on assets built on a developer machine. The wrapper repo (AUREUS-a-s/aimes-superset)
# consumes the result via `FROM` and layers deployment concerns on top.
#
# Tagging:
#   tag  6.1.0-aimes.N  ->  superset-base:6.1.0-aimes.N  (immutable)  + :6.1.0-aimes (alias)
#   push to aimes       ->  superset-base:aimes-<sha7>
#   pull request        ->  superset-base-dev:<branch>-<sha7>
#
# Requires:
#   Organization variable: HARBOR_HOSTNAME
#   Secrets:               HARBOR_USERNAME, HARBOR_PASSWORD
#
# See docs/MIGRATION-PLAN.md in the wrapper repo for the full architecture.

name: AIMES base image

on:
  push:
    branches: [aimes/main]
    tags: ['*-aimes.*']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [aimes/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimes-base-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push base image
    runs-on: ubuntu-latest
    # Fork PRs cannot access the Harbor secrets, so there is nothing to push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      # An upstream upgrade reintroduces all of upstream's workflows. Fail loudly here
      # rather than let them run. See MIGRATION-PLAN.md §3.0.
      - name: Assert only AIMES workflows are present
        run: |
          set -euo pipefail
          unexpected="$(ls .github/workflows | grep -v '^aimes-' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Upstream workflows reintroduced: $(echo $unexpected | tr '\n' ' ')"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOSTNAME }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine tags
        id: meta
        run: |
          set -euo pipefail
          HOST="${{ vars.HARBOR_HOSTNAME }}"
          UPSTREAM="$(tr -d '[:space:]' < .aimes-upstream)"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            REF="${{ github.head_ref }}"
            TAGS=("$HOST/aimes/superset-base-dev:${REF//\//-}-${SHA:0:7}")
            VCS_REF="$SHA"

          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            # A release tag must agree with .aimes-upstream, so an image can never
            # claim an upstream version it was not built from.
            case "$TAG" in
              "${UPSTREAM}-aimes."*) ;;
              *)
                echo "::error::Tag '$TAG' disagrees with .aimes-upstream ($UPSTREAM). Expected ${UPSTREAM}-aimes.<n>."
                exit 1
                ;;
            esac
            TAGS=(
              "$HOST/aimes/superset-base:${TAG}"
              "$HOST/aimes/superset-base:${UPSTREAM}-aimes"
            )
            VCS_REF="${{ github.sha }}"

          else
            TAGS=("$HOST/aimes/superset-base:aimes-${GITHUB_SHA:0:7}")
            VCS_REF="${{ github.sha }}"
          fi

          echo "UPSTREAM=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "VCS_REF=$VCS_REF" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          { echo "TAGS<<EOF"; printf '%s\n' "${TAGS[@]}"; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            DEV_MODE=false
            BUILD_TRANSLATIONS=false
            INCLUDE_CHROMIUM=true
            INCLUDE_FIREFOX=false
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.VCS_REF }}
            org.opencontainers.image.created=${{ steps.meta.outputs.BUILD_DATE }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            com.aureus.superset.upstream_version=${{ steps.meta.outputs.UPSTREAM }}
          cache-from: type=registry,ref=${{ vars.HARBOR_HOSTNAME }}/aimes/superset-base-cache:buildcache
          cache-to: type=registry,ref=${{ vars.HARBOR_HOSTNAME }}/aimes/superset-base-cache:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "### Base image published"
            echo ""
            echo "Upstream Superset: \`${{ steps.meta.outputs.UPSTREAM }}\`"
            echo ""
            echo '```'
            printf '%s\n' '${{ steps.meta.outputs.TAGS }}' | sed '/^$/d'
            echo ""
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Pin this in the wrapper repo's Dockerfile:"
            echo '```dockerfile'
            echo "ARG BASE_IMAGE=$(printf '%s' '${{ steps.meta.outputs.TAGS }}' | head -1)@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
